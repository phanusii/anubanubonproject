name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  # Allow manual "Run workflow" from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Apps Script source
        run: npm run check:apps-script

      - name: Build Next.js App
        run: npx next build --webpack
        env:
          # Firebase client config is embedded in the code as defaults; these optional
          # secrets override it if you ever set them.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Check Firebase Service Account Secret
        id: check_secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT secret is not set — build succeeded but deploy is skipped."
          fi

      - name: Deploy Hosting (website)
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}'
          channelId: live
          projectId: anubanubonproject

      - name: Deploy Firestore rules
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only firestore:rules --project anubanubonproject --non-interactive

      - name: Deploy Firestore indexes
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only firestore:indexes --project anubanubonproject --non-interactive

      - name: Check whether Storage rules changed
        id: storage_changes
        run: |
          if git diff --quiet HEAD^ HEAD -- storage.rules; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Storage rules
        # Storage permissions are checked only when its rule file changes. A
        # normal website release must not fail or skip indexes for an unchanged
        # Storage configuration.
        if: steps.check_secret.outputs.has_secret == 'true' && steps.storage_changes.outputs.changed == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only storage --project anubanubonproject --non-interactive
