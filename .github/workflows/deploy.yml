name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npx next build --webpack

      - name: Check Firebase Service Account Secret
        id: check_secret
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "⚠️ Notice: FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT secret is not set in GitHub repository settings yet."
            echo "Code compilation & build succeeded 100%!"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANUBANUBONPROJECT }}'
          channelId: live
          projectId: anubanubonproject
